[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragonlabs"
version = "0.1.0"
authors = [
    { name="George T. Senior", email="george.senior.nz@outlook.com" }
]
description = "A placeholder for the DragonLabs library"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/dragonlabs-repositories"
